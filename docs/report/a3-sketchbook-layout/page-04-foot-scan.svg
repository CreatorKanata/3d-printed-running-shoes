<!-- docs/report/a3-sketchbook-layout/page-04-foot-scan.svg | A3縦のスキャン台紙 | 足の3Dスキャンから掃除までを写真3枚で示すため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">4ページ目 自分の足を3Dでスキャン</title><desc id="desc">Heges、スキャン直後、掃除後のL判写真を貼り、データ作成の流れを説明するA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.7px;font-weight:700}.sub{font-size:4.9px;font-weight:700}.body{font-size:3.8px}.small{font-size:3px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.arrow{stroke:#e16a22;stroke-width:1.2;fill:none;marker-end:url(#head)}.line{stroke:#177db7;stroke-width:.45}</style>
  <defs><marker id="head" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5z" fill="#e16a22"/></marker></defs>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 4 / 10</text><text class="title" x="148.5" y="36" text-anchor="middle">自分の足を3Dでスキャン</text>
  <g data-source="images/report/heges-scan.png" data-print-size="89x127mm" data-orientation="portrait"><rect class="photo" x="10" y="52" width="89" height="127"/><text class="sub" x="54.5" y="111" text-anchor="middle">L判写真を貼る</text><text class="small" x="54.5" y="117" text-anchor="middle">heges-scan.png</text></g>
  <g data-source="images/report/foot-3d-scan-raw.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="120" y="52" width="127" height="89"/><text class="sub" x="183.5" y="91" text-anchor="middle">L判写真を貼る</text><text class="small" x="183.5" y="98" text-anchor="middle">foot-3d-scan-raw.png</text></g>
  <g data-source="images/report/foot-3d-scan-clean.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="120" y="152" width="127" height="89"/><text class="sub" x="183.5" y="191" text-anchor="middle">L判写真を貼る</text><text class="small" x="183.5" y="198" text-anchor="middle">foot-3d-scan-clean.png</text></g>
  <path class="arrow" d="M101 115 H114"/><path class="arrow" d="M183 143 V149"/>
  <text class="sub" x="10" y="263">足の形をデータにするまで</text><rect class="hand" x="10" y="270" width="277" height="66"/><text class="body" x="17" y="284">① iPhoneのTrueDepthで足をスキャンした。</text><text class="body" x="17" y="299">② 床やまわりのいらない部分（ノイズ）を消した。</text><text class="body" x="17" y="314">③ 足だけの3Dデータを、くつの設計に使った。</text>
  <text class="sub" x="10" y="357">ここに手書きの小さな図をかこう</text><rect class="hand" x="10" y="364" width="277" height="30"/><text class="small" x="17" y="378">足 → 3Dスキャン → きれいにする → CAD　を、太い矢印でかく。</text>
</svg>
