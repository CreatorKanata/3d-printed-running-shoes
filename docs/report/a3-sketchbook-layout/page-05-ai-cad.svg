<!-- docs/report/a3-sketchbook-layout/page-05-ai-cad.svg | A3縦の設計台紙 | AI・Fusion画面と3方向CAD画像、手書き関係図を置くため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">5ページ目 AIと3D CADでくつをデザイン</title><desc id="desc">CAD操作画面と正面・側面・斜めの完成デザインを貼り、AI、MCP、Fusionの関係を手書きで示すA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.4px;font-weight:700}.sub{font-size:4.8px;font-weight:700}.body{font-size:3.7px}.small{font-size:2.9px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.hint{fill:#fff;stroke:#90bcd8;stroke-width:.55}.arrow{stroke:#e16a22;stroke-width:1;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5z" fill="#e16a22"/></marker></defs>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 5 / 10</text><text class="title" x="148.5" y="34" text-anchor="middle">AIと3D CADでくつをデザイン</text><text class="small" x="148.5" y="42" text-anchor="middle">デザインは、プリントする前にいろいろな方向からたしかめられる。</text>
  <g data-source="images/report/cad-design-with-ai.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="50" width="127" height="89"/><text class="sub" x="73.5" y="89" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="96" text-anchor="middle">cad-design-with-ai.png</text></g>
  <g data-source="images/3d-cad/asm-honeycomb-front.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="160" y="50" width="127" height="89"/><text class="sub" x="223.5" y="89" text-anchor="middle">L判写真を貼る</text><text class="small" x="223.5" y="96" text-anchor="middle">asm-honeycomb-front.png（正面）</text></g>
  <g data-source="images/3d-cad/asm-honeycomb-side.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="150" width="127" height="89"/><text class="sub" x="73.5" y="189" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="196" text-anchor="middle">asm-honeycomb-side.png（側面）</text></g>
  <g data-source="images/3d-cad/asm-honeycomb-isometric.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="160" y="150" width="127" height="89"/><text class="sub" x="223.5" y="189" text-anchor="middle">L判写真を貼る</text><text class="small" x="223.5" y="196" text-anchor="middle">asm-honeycomb-isometric.png（斜め）</text></g>
  <text class="sub" x="10" y="258">ここに手書きの図をかこう　「アイデアが3Dのくつになるまで」</text><rect class="hand" x="10" y="265" width="277" height="104"/>
  <rect class="hint" x="20" y="295" width="48" height="20" rx="2"/><text class="body" x="44" y="307" text-anchor="middle">かなたくんの</text><text class="body" x="44" y="312" text-anchor="middle">アイデア</text>
  <rect class="hint" x="91" y="295" width="42" height="20" rx="2"/><text class="body" x="112" y="307" text-anchor="middle">AI</text><text class="small" x="112" y="312" text-anchor="middle">Codexなど</text>
  <rect class="hint" x="154" y="295" width="35" height="20" rx="2"/><text class="body" x="171.5" y="307" text-anchor="middle">MCP</text><text class="small" x="171.5" y="312" text-anchor="middle">つなぐ</text>
  <rect class="hint" x="210" y="295" width="55" height="20" rx="2"/><text class="body" x="237.5" y="307" text-anchor="middle">Fusion</text><text class="small" x="237.5" y="312" text-anchor="middle">3D CAD</text>
  <path class="arrow" d="M69 305 H89"/><path class="arrow" d="M134 305 H152"/><path class="arrow" d="M190 305 H208"/>
  <text class="small" x="18" y="337">青い枠の下に、「足に合うように」「軽くしたい」など、AIに伝えたことを手書きで足す。</text><text class="small" x="18" y="350">側面写真では、ハニカムのソールと、つま先が上がった形に丸をつけよう。</text>
  <text class="small" x="148.5" y="395" text-anchor="middle">★ 父親は技術面を手伝い、かなたくんが作りたいことを決めた。</text>
</svg>
