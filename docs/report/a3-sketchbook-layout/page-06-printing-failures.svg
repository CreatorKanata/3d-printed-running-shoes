<!-- docs/report/a3-sketchbook-layout/page-06-printing-failures.svg | A3縦の試作台紙 | プリンター・スライサー・失敗写真と条件変更を記録するため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">6ページ目 3Dプリンターで何度もためした</title><desc id="desc">スライサー、3Dプリンター、失敗した試作品のL判写真を貼り、TPUの調整を記録するA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.4px;font-weight:700}.sub{font-size:4.8px;font-weight:700}.body{font-size:3.7px}.small{font-size:2.9px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.line{stroke:#177db7;stroke-width:.45}</style>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 6 / 10</text><text class="title" x="148.5" y="36" text-anchor="middle">3Dプリンターで何度もためした</text>
  <g data-source="images/report/3d-print-slicer.jpg" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="55" width="127" height="89"/><text class="sub" x="73.5" y="94" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="101" text-anchor="middle">3d-print-slicer.jpg</text></g>
  <g data-source="images/report/3d-printer-ad5x.jpg" data-print-size="89x127mm" data-orientation="portrait"><rect class="photo" x="170" y="55" width="89" height="127"/><text class="sub" x="214.5" y="114" text-anchor="middle">L判写真を貼る</text><text class="small" x="214.5" y="121" text-anchor="middle">3d-printer-ad5x.jpg</text></g>
  <g data-source="images/report/many-failures.jpg" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="155" width="127" height="89"/><text class="sub" x="73.5" y="194" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="201" text-anchor="middle">many-failures.jpg</text></g>
  <text class="sub" x="155" y="207">むずかしかったこと</text><rect class="hand" x="155" y="214" width="132" height="48"/><text class="body" x="162" y="228">やわらかいTPUは、</text><text class="body" x="162" y="239">きれいにプリントしにくかった。</text><line class="line" x1="162" y1="252" x2="280" y2="252"/>
  <text class="sub" x="10" y="280">変えてためしたこと</text><rect class="hand" x="10" y="287" width="277" height="72"/><text class="body" x="17" y="301">□ ノズルの温度を変えた　　□ ノズルを0.4 mmから0.6 mmに変えた</text><text class="body" x="17" y="318">□ フィラメント切換器を使わないようにした</text><text class="body" x="17" y="335">□ ほかに変えたこと：</text><line class="line" x1="74" y1="333" x2="279" y2="333"/>
  <rect class="hand" x="10" y="374" width="277" height="20"/><text class="body" x="17" y="387">分かったこと：うまくいかない時は、条件を一つずつ変えてくらべる。</text>
</svg>
