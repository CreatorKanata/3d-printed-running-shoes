  <g data-source="images/report/competitor-new-balance.png" data-print-size="89x127mm" data-orientation="portrait"><rect class="photo" x="104" y="52" width="89" height="127"/><text class="sub" x="148.5" y="110" text-anchor="middle">L判写真を貼る</text><text class="small" x="148.5" y="116" text-anchor="middle">competitor-new-balance.png</text></g>
  <g data-source="images/report/competitor-nike.png" data-print-size="89x127mm" data-orientation="portrait"><rect class="photo" x="198" y="52" width="89" height="127"/><text class="sub" x="242.5" y="110" text-anchor="middle">L判写真を貼る</text><text class="small" x="242.5" y="116" text-anchor="middle">competitor-nike.png</text></g>
