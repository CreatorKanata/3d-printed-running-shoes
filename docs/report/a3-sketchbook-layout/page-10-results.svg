<!-- docs/report/a3-sketchbook-layout/page-10-results.svg | A3縦のまとめ台紙 | かなたくん自身の結果・感想・次の改良を手書きで完成させるため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">10ページ目 分かったことと次にためしたいこと</title><desc id="desc">写真を置かず、実際に履いた結果、感想、次の改良案をかなたくん自身の言葉で書くA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:9px;font-weight:700}.sub{font-size:5px;font-weight:700}.body{font-size:3.9px}.small{font-size:3px}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.line{stroke:#177db7;stroke-width:.45}.star{fill:#f4b400;stroke:#cc8500;stroke-width:.4}</style>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 10 / 10</text><text class="title" x="148.5" y="40" text-anchor="middle">分かったことと、次にためしたいこと</text><text class="body" x="148.5" y="51" text-anchor="middle">ここは、かなたくんが実際に見て・はいて・考えたことを書くページ。</text>
  <text class="sub" x="15" y="76">1. 作る前のよそうは、どうだった？</text><rect class="hand" x="15" y="83" width="267" height="53"/><text class="body" x="22" y="99">ぼくは、　　　　　　　　　　　　　　　　　　　　　　　　　　と予想した。</text><line class="line" x1="22" y1="117" x2="275" y2="117"/>
  <text class="sub" x="15" y="159">2. 実際にはいて・走ってみた結果</text><rect class="hand" x="15" y="166" width="267" height="78"/><text class="body" x="22" y="182">はき心地（足に合った？　あたる所は？）：</text><line class="line" x1="22" y1="193" x2="275" y2="193"/><text class="body" x="22" y="210">走った感じ（軽さ・はね返り・歩きやすさ）：</text><line class="line" x1="22" y1="221" x2="275" y2="221"/><text class="small" x="22" y="235">走ったタイムや距離を測ったら、ここに数字も書く。</text>
  <text class="sub" x="15" y="268">3. いちばん大変だったこと・工夫したこと</text><rect class="hand" x="15" y="275" width="267" height="46"/><text class="body" x="22" y="291">大変だったこと：</text><text class="body" x="22" y="307">工夫してできるようになったこと：</text>
  <text class="sub" x="15" y="344">4. 次に改良したいところ</text><rect class="hand" x="15" y="351" width="267" height="42"/><text class="body" x="22" y="367">次は、　　　　　　　　　　　　　　　　　　　　　　　　　　をためしたい。</text><polygon class="star" points="263,361 266,368 274,368 268,373 270,380 263,376 256,380 258,373 252,368 260,368"/>
  <text class="small" x="148.5" y="405" text-anchor="middle">おわり　｜　自分で考えて、ためして、直していくことが研究になった。</text>
</svg>
