<!-- docs/report/a3-sketchbook-layout/page-08-insole-plate.svg | A3縦の仕上げ台紙 | インソール、完成アッパー、ポリカーボネート板を説明するため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">8ページ目 インソールとプレートを工夫した</title><desc id="desc">インソール、完成アッパー、ポリカーボネート板のL判写真を貼り、材料の工夫を説明するA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.4px;font-weight:700}.sub{font-size:4.8px;font-weight:700}.body{font-size:3.7px}.small{font-size:2.9px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.line{stroke:#177db7;stroke-width:.45}</style>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 8 / 10</text><text class="title" x="148.5" y="36" text-anchor="middle">インソールとプレートを工夫した</text>
  <g data-source="images/report/insert-insole.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="55" width="127" height="89"/><text class="sub" x="73.5" y="94" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="101" text-anchor="middle">insert-insole.png</text></g>
  <g data-source="images/report/shoe-upper-finish.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="150" y="55" width="127" height="89"/><text class="sub" x="213.5" y="94" text-anchor="middle">L判写真を貼る</text><text class="small" x="213.5" y="101" text-anchor="middle">shoe-upper-finish.png</text></g>
  <g data-source="images/report/pc-plate1.jpg" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="158" width="127" height="89"/><text class="sub" x="73.5" y="197" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="204" text-anchor="middle">pc-plate1.jpg</text></g>
  <text class="sub" x="150" y="174">インソールを入れた理由</text><rect class="hand" x="150" y="181" width="127" height="43"/><text class="body" x="157" y="196">はき心地をよくするため。</text><line class="line" x1="157" y1="211" x2="270" y2="211"/>
  <text class="sub" x="150" y="246">カーボンの代わりにしたもの</text><rect class="hand" x="150" y="253" width="127" height="45"/><text class="body" x="157" y="268">ポリカーボネートの板</text><text class="small" x="157" y="280">家の3Dプリンターで作れる。</text>
  <text class="sub" x="10" y="319">ポリカーボネートを選んだ理由</text><rect class="hand" x="10" y="326" width="267" height="48"/><text class="body" x="17" y="340">曲げても折れにくく、元にもどろうとする力があった。</text><line class="line" x1="17" y1="357" x2="270" y2="357"/>
  <text class="small" x="148.5" y="395" text-anchor="middle">★ 次のページで、板をソールの中に入れる。</text>
</svg>
