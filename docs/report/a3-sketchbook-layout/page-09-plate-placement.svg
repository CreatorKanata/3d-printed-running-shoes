<!-- docs/report/a3-sketchbook-layout/page-09-plate-placement.svg | A3縦の組立台紙 | 板の強さとソールへの埋め込み手順を写真4枚で示すため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">9ページ目 プレート入りソールにちょうせん</title><desc id="desc">ポリカーボネート板のテストと、プリント途中で板を入れる3手順のL判写真を貼るA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.4px;font-weight:700}.sub{font-size:4.7px;font-weight:700}.body{font-size:3.7px}.small{font-size:2.9px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.arrow{stroke:#e16a22;stroke-width:1;fill:none;marker-end:url(#head)}.line{stroke:#177db7;stroke-width:.45}</style>
  <defs><marker id="head" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5z" fill="#e16a22"/></marker></defs>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 9 / 10</text><text class="title" x="148.5" y="36" text-anchor="middle">プレート入りソールにちょうせん</text>
  <g data-source="images/report/pc-plate2.jpg" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="50" width="127" height="89"/><text class="sub" x="73.5" y="89" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="96" text-anchor="middle">pc-plate2.jpg（曲げテスト）</text></g>
  <g data-source="images/report/pc-plate-placement1.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="160" y="50" width="127" height="89"/><text class="sub" x="223.5" y="89" text-anchor="middle">L判写真を貼る</text><text class="small" x="223.5" y="96" text-anchor="middle">pc-plate-placement1.png</text></g>
  <g data-source="images/report/pc-plate-placement2.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="150" width="127" height="89"/><text class="sub" x="73.5" y="189" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="196" text-anchor="middle">pc-plate-placement2.png</text></g>
  <g data-source="images/report/pc-plate-placement3.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="160" y="150" width="127" height="89"/><text class="sub" x="223.5" y="189" text-anchor="middle">L判写真を貼る</text><text class="small" x="223.5" y="196" text-anchor="middle">pc-plate-placement3.png</text></g>
  <text class="sub" x="10" y="260">ソールの中に板を入れた方法</text><rect class="hand" x="10" y="267" width="277" height="58"/><text class="body" x="17" y="282">① プリントを、板を置く高さで一時停止した。</text><text class="body" x="17" y="299">② 接着剤をぬった板を置いた。</text><text class="body" x="17" y="316">③ プリントを再開して、板をソールの中に入れた。</text>
  <text class="sub" x="10" y="346">ここに手書きの矢印を足そう</text><rect class="hand" x="10" y="353" width="277" height="40"/><text class="body" x="17" y="369">プリントを止める　→　板を置く　→　プリントを再開する</text><text class="small" x="17" y="382">写真に①②③の丸数字と、オレンジ色の矢印を手書きでつなぐ。</text>
</svg>
