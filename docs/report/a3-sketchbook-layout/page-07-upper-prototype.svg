<!-- docs/report/a3-sketchbook-layout/page-07-upper-prototype.svg | A3縦のアッパー試作台紙 | 初回の印刷・試着・本格印刷の写真3枚を示すため -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420" role="img" aria-labelledby="title desc">
  <rect width="297" height="420" fill="#ffffff"/><title id="title">7ページ目 まずアッパーだけを作ってはいた</title><desc id="desc">初回アッパーの印刷、試着、本格的な印刷のL判写真を貼り、フィット感を記録するA3縦台紙。</desc>
  <style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16233a}.title{font-size:8.4px;font-weight:700}.sub{font-size:4.8px;font-weight:700}.body{font-size:3.7px}.small{font-size:2.9px}.photo{fill:#fff5c7;stroke:#d49a00;stroke-width:.7}.hand{fill:#eef8ff;stroke:#177db7;stroke-width:.7;stroke-dasharray:3 2}.edge{fill:none;stroke:#16233a;stroke-width:.7}.line{stroke:#177db7;stroke-width:.45}</style>
  <rect class="edge" x="8" y="8" width="281" height="404" rx="2"/><text class="small" x="12" y="18">夏休みの自由研究　｜　ページ 7 / 10</text><text class="title" x="148.5" y="36" text-anchor="middle">まずアッパーだけを作って、はいてみた</text>
  <g data-source="images/report/first-shoe-upper-printing.jpg" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="55" width="127" height="89"/><text class="sub" x="73.5" y="94" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="101" text-anchor="middle">first-shoe-upper-printing.jpg</text></g>
  <g data-source="images/report/first-shoe-upper-prototype.jpg" data-print-size="89x127mm" data-orientation="portrait"><rect class="photo" x="170" y="55" width="89" height="127"/><text class="sub" x="214.5" y="114" text-anchor="middle">L判写真を貼る</text><text class="small" x="214.5" y="121" text-anchor="middle">first-shoe-upper-prototype.jpg</text></g>
  <g data-source="images/report/shoe-upper-printing.png" data-print-size="127x89mm" data-orientation="landscape"><rect class="photo" x="10" y="155" width="127" height="89"/><text class="sub" x="73.5" y="194" text-anchor="middle">L判写真を貼る</text><text class="small" x="73.5" y="201" text-anchor="middle">shoe-upper-printing.png</text></g>
  <text class="sub" x="155" y="207">はいてみたら、どうだった？</text><rect class="hand" x="155" y="214" width="132" height="48"/><text class="body" x="162" y="228">□ つま先　□ かかと</text><text class="body" x="162" y="240">□ 足の甲　□ 足首</text><text class="small" x="162" y="252">あたり具合や、よかった所を書く。</text>
  <text class="sub" x="10" y="280">材料をくらべて分かったこと</text><rect class="hand" x="10" y="287" width="277" height="72"/><text class="body" x="17" y="301">TPU：</text><text class="body" x="17" y="317">PEBA：</text><text class="body" x="17" y="333">最終：Siraya Tech Flex TPU Air（白・黒）：</text><text class="body" x="17" y="349">設定：70A・260℃・0.6 mmノズル</text><line class="line" x1="55" y1="299" x2="279" y2="299"/><line class="line" x1="55" y1="315" x2="279" y2="315"/><line class="line" x1="113" y1="331" x2="279" y2="331"/>
  <rect class="hand" x="10" y="374" width="277" height="20"/><text class="body" x="17" y="387">このページの結論：小さく試作してから、本格的な形を作るとよい。</text>
</svg>
